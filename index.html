<!-- Multi-Product Sales Entry Form -->
<div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
    <h3 class="font-semibold text-slate-200 mb-3 flex items-center gap-2 text-sm">
        <i class="fa-solid fa-plus-circle text-indigo-400"></i> নতুন সেলস এন্ট্রি যোগ করুন (একাধিক প্রোডাক্টসহ)
    </h3>
    <form id="entryForm" onsubmit="handleAddEntry(event)" class="space-y-3">
        <div>
            <label class="text-xs text-slate-400 mb-1 block">তারিখ ও সময় (Auto Selected)</label>
            <input type="datetime-local" id="entryDateTime" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200" required>
        </div>

        <div>
            <label class="text-xs text-slate-400 mb-1 block">কাস্টমারের নাম</label>
            <input type="text" id="customerName" placeholder="কাস্টমারের নাম" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
        </div>

        <!-- Dynamic Product Cart Section -->
        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
            <span class="text-xs font-bold text-indigo-400">প্রোডাক্ট ও পরিমাণ (Quantity) যোগ করুন:</span>
            
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="cartProductName" placeholder="প্রোডাক্টের নাম (যেমন: Shirt)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                <input type="number" id="cartProductQty" value="1" min="1" placeholder="পরিমাণ" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="cartCostPrice" placeholder="একক ক্রয় মূল্য (৳)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                <input type="number" id="cartSellPrice" placeholder="একক বিক্রয় মূল্য (৳)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
            </div>
            
            <button type="button" onclick="addCartItem()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2 rounded-lg font-medium transition">
                + তালিকায় এই প্রোডাক্ট যোগ করুন
            </button>

            <!-- Cart Items Container -->
            <div id="cartItemsList" class="space-y-1.5 pt-2">
                <div class="text-xs text-slate-500 italic">কোনো প্রোডাক্ট যোগ করা হয়নি</div>
            </div>
        </div>

        <div>
            <label class="text-xs text-slate-400 mb-1 block">বাকি (Due Amount - যদি থাকে)</label>
            <input type="number" id="dueAmount" placeholder="৳ ০" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
        </div>

        <!-- Profit/Loss Preview Banner -->
        <div id="previewBox" class="hidden p-3 rounded-xl border text-sm font-medium flex justify-between items-center">
            <span>হিসাবকৃত ফলাফল:</span>
            <span id="previewValue" class="font-bold">৳ 0.00</span>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm">
            সম্পূর্ণ সেলস এন্ট্রি সেভ করুন
        </button>
    </form>
</div>
